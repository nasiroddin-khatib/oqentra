# Include this inside the HTTPS server block for your OQENTRA website.
# Keep the API process bound to 127.0.0.1; expose it through Nginx only.
location /api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# Prometheus metrics should be reachable only from the monitoring network.
# Replace 10.0.0.0/16 with the private CIDR of your monitoring environment.
location = /metrics {
    allow 127.0.0.1;
    allow 10.0.0.0/16;
    deny all;
    proxy_pass http://127.0.0.1:4000/metrics;
    proxy_set_header Host $host;
}
