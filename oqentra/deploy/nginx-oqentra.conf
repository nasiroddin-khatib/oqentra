# OQENTRA combined website + API Nginx server block.
# Replace YOUR_DOMAIN and certificate paths before enabling this file.
# The frontend is served from /opt/oqentra/frontend; Express listens on 127.0.0.1:4000.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /opt/oqentra/frontend;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:OQENTRA_TLS:10m;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Static public website.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Keep /api on the same origin as the website; Express stays private.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Restrict Prometheus metrics to the host and your monitoring subnet.
    # Replace 10.0.0.0/16 with your real private monitoring CIDR.
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:4000/metrics;
        proxy_set_header Host $host;
    }

    location ~ /\. {
        deny all;
    }
}
